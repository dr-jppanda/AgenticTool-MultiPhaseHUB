[project]
name = "mht-datahub"
version = "0.1.0"
description = "Auto-labeled, evidence-grounded catalog of multiphase heat transfer datasets"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "anthropic>=0.60",
    "CoolProp>=6.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.7"]
# `curves` renders with matplotlib. `digitize` reads figures directly through
# an agentic `claude` CLI call, not a local OCR/vector-parsing pipeline, so
# it has no extra of its own.
plot = ["matplotlib>=3.7"]

[project.scripts]
mhtdb = "mhtdb.pipeline:main"

[tool.setuptools.packages.find]
include = ["mhtdb*"]
